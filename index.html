<!--
index.html
============================================================
这是 App 的主页面。

新版结构：
对象 × 场景 × 礼貌度 × 长度

这个页面帮助用户整理可以复制到 ChatGPT 的提示词。
============================================================
-->

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>职场日语表达助手</title>

  <link rel="manifest" href="manifest.webmanifest" />

  <meta name="apple-mobile-web-app-title" content="职场日语" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#0f2a4a" />

  <link rel="icon" href="icon.png" type="image/png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app-shell">

    <header class="app-header">
      <div class="logo-circle" aria-hidden="true">
        <img src="icon.png" alt="" />
      </div>

      <div class="header-text">
        <p class="eyebrow">中文 → 自然职场日语</p>
        <h1>职场日语表达助手</h1>
        <p class="subtitle">根据沟通对象和场景，生成可复制到 ChatGPT 的提示词</p>
      </div>
    </header>

    <section class="notice-card">
      <div class="notice-title">先写中文，再选择使用场景</div>
      <p>
        生成后复制到 ChatGPT，即可获得自然、得体且保留原意的职场日语。
        请不要输入客户名、项目名、公司机密等敏感信息。
      </p>
    </section>

    <main class="main-card">

      <div class="section-title-row">
        <span class="step-badge">1</span>
        <h2 id="inputTitle">输入你想表达的中文</h2>
      </div>

      <label class="visually-hidden" for="chineseInput">输入你想表达的中文</label>
      <textarea
        id="chineseInput"
        class="text-input"
        placeholder="例如：任务进度有点延迟，但我已经确认了原因，今天下午会继续处理。"
      ></textarea>

      <div class="quick-helper">
        <span>快速填入示例</span>
        <span>会替换当前内容和设置</span>
      </div>
      <div class="quick-row" aria-label="快速填入示例">
        <button type="button" class="quick-button" data-preset="delay">进度延期示例</button>
        <button type="button" class="quick-button" data-preset="ask">同事确认示例</button>
        <button type="button" class="quick-button" data-preset="sick">请假/迟到示例</button>
      </div>

      <div class="section-title-row">
        <span class="step-badge">2</span>
        <h2>选择沟通条件</h2>
      </div>

      <label class="field-label" for="audienceSelect">
        对象：说给谁
      </label>
      <select id="audienceSelect" class="select-input">
        <option value="manager">上司</option>
        <option value="colleague">同事</option>
        <option value="team">团队全体</option>
        <option value="external">客户 / 公司外部</option>
        <option value="self">自己备忘</option>
      </select>

      <label class="field-label" for="channelSelect">
        场景：在哪里使用
      </label>
      <select id="channelSelect" class="select-input">
        <option value="chat">Slack / Teams</option>
        <option value="email">邮件</option>
        <option value="spoken">口头报告 / 朝会发言</option>
        <option value="standup">朝会模板填写</option>
        <option value="document">文档 / 会议记录</option>
      </select>

      <div class="section-title-row compact">
        <span class="step-badge">3</span>
        <h2>调整表达风格</h2>
      </div>

      <div class="two-column-grid">
        <div>
          <label class="field-label" for="politenessSelect">
            礼貌度：表达要多正式
          </label>
          <select id="politenessSelect" class="select-input">
            <option value="relaxed">稍微轻松</option>
            <option value="normal" selected>普通礼貌</option>
            <option value="formal">更正式</option>
          </select>
        </div>

        <div>
          <label class="field-label" for="lengthSelect">
            长度 / 形式：输出要多长
          </label>
          <select id="lengthSelect" class="select-input">
            <option value="bullets">短句 / 条目</option>
            <option value="oneSentence">一句话</option>
            <option value="short" selected>简短：1-2句</option>
            <option value="standard">标准：2-3句</option>
            <option value="detailed">稍详细：4-5句</option>
          </select>
        </div>
      </div>

      <button id="generateButton" class="primary-button" type="button">
        生成提示词
      </button>

      <p id="statusMessage" class="status-message" role="status" aria-live="polite"></p>
    </main>

    <section id="resultSection" class="result-card hidden" aria-labelledby="resultTitle">
      <div class="result-header">
        <div>
          <p class="eyebrow small">复制到 ChatGPT 使用</p>
          <h2 id="resultTitle" tabindex="-1">已为你整理好提示词</h2>
        </div>
        <button id="copyButton" class="copy-button" type="button">
          复制提示词
        </button>
      </div>

      <label class="visually-hidden" for="promptOutput">生成的提示词</label>
      <textarea id="promptOutput" class="prompt-output" readonly></textarea>

      <p class="hint-text">
        复制后请切换到 ChatGPT App 或网页版，把提示词粘贴进去发送即可。
      </p>
    </section>

    <section class="history-card">
      <div class="history-header">
        <div>
          <p class="eyebrow small">最近使用</p>
          <h2>最近记录</h2>
        </div>
        <button id="clearHistoryButton" class="secondary-button" type="button" disabled>
          清空
        </button>
      </div>

      <div id="historyList" class="history-list">
        <p class="empty-history">还没有历史记录。</p>
      </div>

      <p id="historyStatusMessage" class="history-status-message" role="status" aria-live="polite"></p>
    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
